version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - corepack enable
        - corepack prepare pnpm@10.5.2 --activate
    build:
      commands:
        # 한 줄씩 안전하게 .env.production 파일 생성
        - echo "GOOGLE_SERVICE_ACCOUNT_CREDENTIALS='${GOOGLE_SERVICE_ACCOUNT_CREDENTIALS}'" > .env.production
        - echo "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://jjindong.com}" >> .env.production
        - echo "NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION}" >> .env.production
        - echo "NEXT_PUBLIC_NAVER_SITE_VERIFICATION=${NEXT_PUBLIC_NAVER_SITE_VERIFICATION}" >> .env.production
        - echo "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}" >> .env.production
        - echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" >> .env.production
        - echo "SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}" >> .env.production
        - echo "YOUTUBE_API_KEYS=${YOUTUBE_API_KEYS}" >> .env.production
        - echo "VIDEO_SUMMARY_WORKER_SECRET=${VIDEO_SUMMARY_WORKER_SECRET}" >> .env.production

        # 의존성 설치
        - pnpm install --no-frozen-lockfile

        # 빌드 진행
        - pnpm run build
        - node scripts/resolve-next-symlinks.js
        - node scripts/prepare-amplify-static.js
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"